services:
  hrms-backend:
    build: .
    container_name: hrms-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./data:/app/data
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"